name: mynote
description: "MyNote - A Flutter application."
# 以下代码行可防止该包通过 `flutter pub publish` 被意外发布到
# pub.dev。这对私有包是首选做法。
publish_to: 'none' # 如需发布到 pub.dev，请删除此行

# 以下内容定义了你应用的版本号与构建号。
# 版本号是三个以点分隔的数字，例如 1.2.43，
# 后面可跟一个以 + 分隔的可选构建号。
# 版本号与构建号均可通过 flutter build 时分别指定
# --build-name 和 --build-number 来覆盖。
# 在 Android 中，build-name 用作 versionName，build-number 用作 versionCode。
# 了解更多 Android 版本管理：https://developer.android.com/studio/publish/versioning
# 在 iOS 中，build-name 用作 CFBundleShortVersionString，build-number 用作 CFBundleVersion。
# 了解更多 iOS 版本管理：
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# 在 Windows 中，build-name 用作产品与文件版本的 major、minor 和 patch 部分，
# 而 build-number 用作构建后缀。
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'
  # Specify a fixed version to ensure consistent behavior.
  # If you want to use a newer version, add ^ before the version number,
  # or directly set the version you want.
  flutter: 3.47.5

# 依赖指定了你的包正常工作所需的其他包。
# 如需自动将包依赖升级到最新版本，
# 可考虑运行 `flutter pub upgrade --major-versions`。另外，
# 也可以通过修改下面的版本号为 pub.dev 上的最新版本，
# 来手动更新依赖。如需查看哪些依赖有更新版本可用，
# 请运行 `flutter pub outdated`。
dependencies:
  #Flutter SDK
  flutter:
    sdk: flutter
  #本地化 / 国际化支持
  flutter_localizations:
    sdk: flutter

  #值相等性比较（实体 == / hashCode）
  equatable: ^3.0.0
  #日期 / 数字 / 货币格式化
  intl: ^0.20.3
  #骨架屏微光占位
  shimmer: ^4.0.0
  #UI 组件库
  material_ui: 1.5.0
  #打开网页 电话 短信 邮件等
  url_launcher: ^6.3.3
  #UUID 生成
  uuid: ^4.6.0
  #函数式编程
  fpdart: ^1.2.0
  #golden 测试
  zoloto: ^0.0.1
  #状态管理 / DI
  flutter_riverpod: ^3.4.3
  #riverpod 代码生成注解
  riverpod_annotation: ^4.0.7
  #freezed 代码生成注解
  freezed_annotation: ^3.1.0
  #JSON 序列化注解
  json_annotation: ^4.12.0
  #动态权限
  permission_handler: ^13.0.2
  #env
  flutter_dotenv: ^6.0.1
  #log
  logger: ^2.8.0
  #包信息
  package_info_plus: ^10.2.2
  #原生分享
  share_plus: ^13.3.1
  #网络请求
  dio: ^5.11.1
  #dio 请求日志美化输出
  pretty_dio_logger: ^1.4.0
  #官方路由
  go_router: ^18.0.2
  #屏幕适配
  flutter_screenutil: ^5.9.3
  #简单数据持久化
  shared_preferences: ^2.5.6
  #熄屏
  wakelock_plus: ^1.8.1
  #主题
  flex_color_scheme: ^9.0.0
  #文件系统目录
  path_provider: ^2.1.6
  #图片缓存
  cached_network_image: ^4.0.4
  #loading 加载指示器集合
  flutter_spinkit: ^5.2.2
  #toast
  fluttertoast: ^10.0.2
  #替换pull refresh
  easy_refresh: ^4.0.0
  #websocket
  web_socket_channel: ^3.0.3
  #Stream扩展
  rxdart: ^0.28.0
  #form表单
  flutter_form_builder: ^11.0.0
  #表单校验规则集
  form_builder_validators: ^11.3.0
  #富文本编辑器（笔记正文，唯一真相源为 Quill Delta JSON）
  flutter_quill: ^11.6.0
  #Quill Delta 文档模型（正文编解码，domain 层要用故显式声明）
  dart_quill_delta: ^10.8.3

  #gRPC 通信
  grpc: ^5.1.0
  #protobuf 序列化（gRPC 配套）
  protobuf: ^6.1.0
  #哈希 / 加密摘要
  crypto: ^3.0.7
  #后台任务调度
  workmanager: ^0.10.10
  #本地数据库（SQLite）
  drift: ^2.35.1
  path: ^1.9.1
  #瀑布流网格（D1 笔记列表 2 列）—— ARCHITECTURE-DESIGN §7.5 裁决新增的唯一 UI 依赖
  flutter_staggered_grid_view: ^0.7.0
  file_picker: ^13.1.0
  #插入笔记图片：把超大图压成 JPEG 再 base64 内嵌（设置项可关）
  flutter_image_compress: ^2.5.1
  #待办提醒：到点弹系统通知（Android / iOS）
  flutter_local_notifications: ^23.0.0-dev.3
  #定时通知要用 TZDateTime（Android 12+ 的精确闹钟只认带时区的时刻）
  timezone: ^0.11.1
  #取系统时区：`tz.local` 自己读不到，必须由它给
  flutter_timezone: ^5.1.1

dev_dependencies:
  #单元测试 / Widget 测试
  flutter_test:
    sdk: flutter

  # "flutter_lints" 包包含一组推荐 lint 规则，
  # 用于鼓励良好的编码实践。该包提供的 lint 集合
  # 在包根目录下的 `analysis_options.yaml` 文件中启用。
  # 请参阅该文件了解如何停用特定 lint 规则并启用额外规则。
  flutter_lints: ^6.0.0
  #drift 代码生成
  drift_dev: ^2.35.1
  #代码生成执行器
  build_runner: ^2.16.1
  # freezed 4.x 才支持 analyzer 13（riverpod_lint 3.1+/riverpod_generator 4 所需）
  freezed: ^4.0.2
  #JSON 序列化代码生成
  json_serializable: ^6.14.1
  #资源文件代码生成（assets.gen.dart）
  flutter_gen_runner: ^5.15.0
  #riverpod 代码生成器
  riverpod_generator: ^4.0.9
  # riverpod_lint 3.1+ 基于 analysis_server_plugin 独立运行，不再需要 custom_lint
  riverpod_lint: ^3.1.9
  #测试 mock
  mocktail: ^1.0.5
  #Quill 官方测试扩展（QuillEditor 自研 TextInputClient，enterText 打不进去）
  flutter_quill_test: ^11.1.0
  #图标生成
  flutter_launcher_icons: ^0.14.4
  #splash生成
  flutter_native_splash: ^2.4.8
# 关于本文件 Dart 通用部分的说明，请参阅
# 以下页面：https://dart.dev/tools/pub/pubspec

# 以下部分为 Flutter 包专属。
flutter:
  generate: true

  # 以下代码行可确保 Material Icons 字体
  # 随你的应用一起打包，以便你能在
  # Material Icons 类中使用这些图标。
  uses-material-design: true

  # 应用资源
  assets:
    # 公共资源
    - assets/images/
    
    # 语言专属资源
    - assets/images/zh/
    - assets/images/en/

    # 笔记详情页背景图（palette 按钮循环切换）
    - assets/images/backgrounds/
    
    # 字体
    - assets/fonts/

  # 一个图片资源可以引用一个或多个分辨率相关的"变体"，请参阅
  # https://flutter.dev/to/resolution-aware-images

  # 关于从包依赖中添加资源的详细信息，请参阅
  # https://flutter.dev/to/asset-from-package

  # 要为你的应用添加自定义字体，请在此 "flutter" 部分中添加一个
  # fonts 小节。列表中的每一项都应包含一个 "family" 键（字体家族名），
  # 以及一个 "fonts" 键（给出字体资源和其他描述信息）。例如：
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # 关于从包依赖中加载字体的详细信息，
  # 请参阅 https://flutter.dev/to/font-from-package
